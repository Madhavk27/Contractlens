  <script>
    // Specifically catch and suppress non-fatal Vite development server WebSocket connection failures,
    // preventing them from interfering with the main application boot sequence in containerized iframe environments.
    function isViteWebSocketError(errorOrMessage) {
      if (!errorOrMessage) return false;
      var str = '';
      if (typeof errorOrMessage === 'string') {
        str = errorOrMessage;
      } else if (errorOrMessage.message || errorOrMessage.stack) {
        str = (errorOrMessage.message || '') + ' ' + (errorOrMessage.stack || '');
      } else {
        str = String(errorOrMessage);
      }
      return (
        str.indexOf('WebSocket') !== -1 ||
        str.indexOf('websocket') !== -1 ||
        str.indexOf('failed to connect to websocket') !== -1 ||
        str.indexOf('@vite/client') !== -1
      );
    }

    // Global unhandled rejection handler
    window.addEventListener('unhandledrejection', function (event) {
      if (isViteWebSocketError(event.reason)) {
        event.preventDefault();
        event.stopImmediatePropagation && event.stopImmediatePropagation();
        console.debug('[ContractLens:Boot] Suppressed non-fatal Vite HMR WebSocket rejection.');
      }
    });

    // Global onerror handler
    window.onerror = function (message, source, lineno, colno, error) {
      if (
        isViteWebSocketError(message) ||
        isViteWebSocketError(error) ||
        (source && source.indexOf('@vite/client') !== -1)
      ) {
        console.debug('[ContractLens:Boot] Suppressed non-fatal Vite development server WebSocket error.');
        return true; // Suppresses browser error modal/bubbling
      }
      return false;
    };
  </script>
